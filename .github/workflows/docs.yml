name: Docs

# Builds the documentation and deploys it to the localoptimizationdoneright organization page,
# https://localoptimizationdoneright.github.io (the `main` branch of localoptimizationdoneright/localoptimizationdoneright.github.io).
# DOCUMENTER_KEY is the private half of a write-enabled deploy key of that repository.
on:
  push:
    branches:
      - main
    # No tag trigger: the site is unversioned (deploydocs versions = nothing),
    # built from main only.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install docs dependencies
        # CauRegistry as well as General until the stack is in General.
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.add(url = "https://github.com/prittjam/CauRegistry.jl")'
          julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
  # The toolkit portal (visualgeometrytoolkit.github.io) mirrors this site:
  # ask it to rebuild once the site is deployed. PORTAL_DISPATCH_TOKEN is a
  # fine-grained token with Actions write on the portal repository.
  portal:
    needs: docs
    if: github.event_name != 'pull_request' && vars.PORTAL_DISPATCH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PORTAL_DISPATCH_TOKEN }}
          repository: VisualGeometryToolkit/visualgeometrytoolkit.github.io
          event-type: docs-updated

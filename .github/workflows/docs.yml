name: Docs

# Builds the documentation and deploys it to the external organization page
# https://localoptimizationdoneright.github.io (repository
# LocalOptimizationDoneRight/localoptimizationdoneright.github.io, branch main;
# see docs/make.jl). Deploying to another repository needs an SSH deploy key:
# its public half is a write-enabled deploy key of that repository, its private
# half the DOCUMENTER_KEY secret of this one.
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install docs dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl

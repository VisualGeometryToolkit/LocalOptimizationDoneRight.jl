name: Docs

# Builds the documentation and deploys it to this repository's gh-pages
# branch, served at https://visualgeometrytoolkit.github.io/LocalOptimizationDoneRight.jl/ . DOCUMENTER_KEY is the
# private half of a write-enabled deploy key of this repository.
on:
  push:
    branches:
      - main
    # No tag trigger: the site is unversioned (deploydocs versions = nothing),
    # built from main only.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install docs dependencies
        # CauRegistry as well as General until the stack is in General.
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.add(url = "https://github.com/prittjam/CauRegistry.jl")'
          julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl

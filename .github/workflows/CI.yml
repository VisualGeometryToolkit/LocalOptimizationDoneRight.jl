name: CI

# The package's suite (test/runtests.jl): the engine on synthetic fixtures and
# the tooling gates (Aqua, ExplicitImports, JET, naming). It needs no data, no
# GPU and no C++ toolchain; the paper project's suite (accv2026/test) is not
# run here — it needs the data roots, a CUDA GPU and the locally built
# RansacLibLO shim.
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
      id-token: write   # Codecov upload by OIDC, no token secret
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.13'
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # General only: every dependency is registered there (the paper project's
      # RansacLibLO is a path source). The repo is one workspace: instantiating
      # the test member resolves every member into the one root Manifest and
      # installs what the tests need.
      - name: Instantiate the test environment
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General")'
          julia --project=test -e 'using Pkg; Pkg.instantiate()'
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false

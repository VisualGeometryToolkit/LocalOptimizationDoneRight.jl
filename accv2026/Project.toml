# =============================================================================
# accv2026 — the ACCV 2026 research project ("Score Sharp, Refine Soft, Polish
# Hard"): drivers (scripts/), configs of record (configs/), data symlinks
# (data/), the paper (paper/), notes, and the classical RansacLib LO baseline
# (lib/RansacLibLO, a vendored C++ shim — unregistered, built locally by
# `Pkg.build("RansacLibLO")`). A DrWatson-style project: it devs the repo's
# package (LocalOptimizationDoneRight) and RansacLibLO by relative path and
# carries every dependency the drivers need; the package's own Project.toml
# stays a library.
#
#   cd accv2026 && julia --project=. scripts/<exp>.jl --plan
#   julia --project=. test/runtests.jl          # the project's tests
# =============================================================================
name = "ACCV2026"


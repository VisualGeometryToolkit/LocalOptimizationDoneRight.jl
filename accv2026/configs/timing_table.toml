# =============================================================================
# timing_table — Table 1's per-call LO timings (scripts/timing_table.jl): every
# timed arm (arm_rosters.jl TIMING_TAGS) at the pt_e_miscal deployed operating
# points, single-threaded, on a fixed fixture of PhotoTourism pairs. The same
# timing file feeds the budget cell's time panel (configs/pt_e_budget.toml
# [render.time] timing = "lo_timing_<tag>_<scene>.jld2").
#
# RUN LAST, ON A QUIET CORE: time_ns() brackets must be uncontended.
# =============================================================================

[experiment]
dataset = "phototourism"
matcher = "sift"
problem = "E"
pool_dir = "accv2026/data/PT-E-SIFT-4K_pf3"   # the PT-E pool of record (pt_e_miscal.toml's)

[operating_points]
miscal_config = "pt_e_miscal"  # the deployed operating points it times (fig3's cell); its run keys this one

[timing]
tag = "pt_sift"                # the file is lo_timing_<tag>_<scene>.jld2
sb_protocol = "phototourism"   # the configs/sample_budget_protocol.toml section the timing runs under
scene = "british_museum"       # the timing fixture: one test scene ...
npairs = 40                    # ... and its first npairs pairs

# ---- the inputs of record (VisualGeometryToolkitEval Reproduce: `missing_inputs` checks each
# path under the data root before a launch). Every input here is a directory tree, so none
# states a per-file sha256; the published trees are pinned by Artifacts.toml (git-tree-sha1).
[inputs.pt_e_pool]
tier = "derived"
path = "accv2026/data/PT-E-SIFT-4K_pf3"
provenance = "the PhotoTourism E scoring pools, regenerated bit for bit by the stage pt_e_pools (scripts/pt_e_pools.jl, configs/pt_e_pools.toml) from pt_raw_validation and pt_raw_test; not published (1.6 TB)"

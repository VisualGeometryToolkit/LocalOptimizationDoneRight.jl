# =============================================================================
# paper_numbers — every number macro paper/main.tex and paper/supplement.tex
# typeset (scripts/paper_numbers.jl → paper/figures/paper_numbers.tex, THE one
# generated macro file; src/paper_numbers.jl computes them). A number in the
# papers' prose is one of these macros or a declared protocol constant
# (test/test_paper_numbers.jl); nothing is typed by hand.
#
# [sources.<name>] names a result of record by the CONFIG of the cell that
# produced it (its keyed directory is re-derived, never copied — so a re-keyed
# cell re-keys this one):
#   miscal     the cell's operating-points sidecar (its ζ evaluation; `oracle`
#              names its oracle_floors.jld2 tag)
#   basin      the basin cell's δ ladder (ladder.jld2)
#   budget     the budget cell's per-scene curves (budget_curves)
#   anchoring  the paired ablation: the miscal cell's ζ evaluation (WITH) and
#              its anchoring_ablation evaluation (WITHOUT)
#   polish     the polishing cell's run (polish_test.jld2: the pooled mAA its summary reports)
#   e2e        the end-to-end cell's summary.tsv
#   selection  the selection-only sweep's summary.jld2 (fig1_sel_miscal.jl render)
#   heb_stats  the HEB statistics cell's per-pair counts (heb_inlier_stats.jl)
#   split      a cell's cross-validation: its scenes and their pool pairs
#
# [[macro]]: name, source, op, its coordinates and arms, and `format`:
#   ops        value (one arm) | min | max | range (lo–hi) | spread (max − min)
#              | oracle_gap (the oracle's mAA ceiling − the best arm)
#              | max_abs_diff (anchoring: |WITHOUT − WITH|) | refinable (count)
#              | statistic (heb_stats) | scenes | pairs (split)
#   arms       arm keys; "@welsch_hq" is configs/protocol.toml [paper] welsch_hq,
#              "@main" figure_style.jl MAIN_ARMS; `exclude` drops arms
#   format     { digits = d } fixed point | { int = true } (thin-space
#              thousands) | { pct = true } | ranges join two of these with "--"
# =============================================================================

[sources.pt_miscal]
kind = "miscal"
config = "pt_e_miscal"
oracle = "PT_E"

[sources.eth_miscal]
kind = "miscal"
config = "accv2026_eth_f_miscal"
oracle = "ETH_F"

[sources.heb_miscal]
kind = "miscal"
config = "heb_h_miscal"
oracle = "HEB_H"

[sources.basin]
kind = "basin"
config = "pt_e_basin"

[sources.pt_budget]
kind = "budget"
config = "pt_e_budget"

[sources.eth_budget]
kind = "budget"
config = "accv2026_eth_f_budget"

[sources.anchoring]
kind = "anchoring"
config = "pt_e_miscal"
pairs = ["IG  +TLSadapt", "IG  +GNC-W", "IG  +GNC-GM"]   # render_anchoring_paired.jl's fixed/anchored pairs

[sources.polish]
kind = "polish"
config = "polish_pt_e"

[sources.e2e]
kind = "e2e"
config = "pt_e_e2e_table"

# Tab. 3's time row: pinned single-threaded repeats on drawn test pairs
# (scripts/e2e_timing.jl), never the accuracy run's multithreaded wall clocks.
[sources.e2e_timing]
kind = "e2e_timing"
config = "pt_e_e2e_timing"

[sources.selection]
kind = "selection"

[sources.heb_stats]
kind = "heb_stats"
config = "heb_stats"
low_inlier_ratio = 0.2   # \HEBFracLow: the fraction of pairs whose GT inlier ratio is below this

[sources.pt_split]
kind = "split"
config = "pt_e_miscal"

[sources.eth_split]
kind = "split"
config = "accv2026_eth_f_miscal"

[sources.heb_split]
kind = "split"
config = "heb_h_miscal"


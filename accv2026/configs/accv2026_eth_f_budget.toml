# =============================================================================
# accv2026_eth_f_budget — the ETH3D-F (SP+LG) sample-budget cell: the main-paper
# Fig 4 grid's third row (2026-10-04: ETH3D F replaces the shelved 7-Scenes
# P3P row). A budget cell like every other (src/cell_stages.jl
# `budget_cell_stages`; the same keys as heb_h_budget.toml): every IG-seeded arm
# of THE deployed ETH3D-F operating points (accv2026_eth_f_miscal's sequential
# CV), streamed on the test side of their cross-validation.
# =============================================================================

[experiment]
dataset = "eth3d"
matcher = "splg"
problem = "F"
pool_dir = "datasets/eth3d/derived/splg/scoring_data_F_pf6"   # pool format 6 (configs/eth_f_pools_v6.toml)

[operating_points]
miscal_config = "accv2026_eth_f_miscal"

[budget]
# The objective-matched Stu-tU-BCD ("IG  +BCD@a*", declared by the operating
# points' cell) streamed here too; opt-in, it keys this cell.
objective_matched = ["IG  +BCD"]
# The research-only zero-clamp Welsch-HQ ("IG  +Lift@zc", declared by the
# operating points' cell) streamed here too; opt-in, it keys this cell.
zero_clamp = ["IG  +Lift"]
protocol = "eth3d"
selectors = ["student_t_uniform"]

[render]
xlog = true                         # a log₂ budget axis (render_budget.jl), as HEB's row
row_label = "ETH3D"
panel = "panel_sample_budget_eth_F.tex"
xticks = [100, 500, 1000, 2000, 4000]
legend = "ethfbudgetlegend"
deploy = true
rows = "maa"             # Fig 4 row: mAA alone
extra_arms = "IG  +BCD"  # Table 1 "other"

# ---- the inputs of record (VisualGeometryToolkitEval Reproduce: `missing_inputs` checks each
# path under the data root before a launch, and its content before a run). Each `sha256` is
# VisualGeometryToolkitEval's tree_sha256 of the directory. The pool trees are the format-6
# ones (scripts/migrated_pools.jl), their digests computed read-only on the data root on
# 2026-11-21; a tree's run records (`_config.toml`, `_provenance.toml`) are left out of
# its digest (`sha256_exclude`): its run of record rewrites them, never a pool.
[inputs.pool]
tier = "derived"
path = "datasets/eth3d/derived/splg/scoring_data_F_pf6"
sha256 = "c9fc6d79820ccf4b7283d324613a3833a4a760bba3cbe952c64b86085aa66259"
sha256_exclude = ["_config.toml", "_provenance.toml"]   # the tree's run records (rewritten by its run of record), not its pools
provenance = "the pools of record at pool format 6: scoring_data_F_pf3 migrated by the stage eth_f_pools_v6 (scripts/migrated_pools.jl)"

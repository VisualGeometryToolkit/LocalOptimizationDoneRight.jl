# =============================================================================
# pt_e_sel_miscal — MAIN-PAPER FIG 1 (fig:sel-miscal; scripts/fig1_sel_miscal.jl):
# scoring-only miscalibration on PhotoTourism / SIFT / E. Every selector family
# is tuned on the perturbed validation pool per ζ by the windowed machinery
# ([tuning.lo_sensitivity_miscal] of configs/tuning.toml) and read out on the
# untouched test pool at the fixed tuned width. Selection-only: no LO refits.
#
# The run's keyed directory is `sensitivity_cell_dir` of this config folded with
# its tuning spec and the ζ ladder of configs/miscal_protocol.toml
# (src/protocol_folds.jl `fold_sensitivity_cell!`):
#   <results>/phototourism/sift/E/Miscalibration/sel-miscal-<run key>
# It replaces the hand-bumped stamp `miscal-sel-allpairs-v5`.
# =============================================================================

[experiment]
dataset = "phototourism"
matcher = "sift"
problem = "E"
pool_dir = "accv2026/data/PT-E-SIFT-4K_pf3"   # the PT-E pool of record (pt_e_miscal.toml's)

[sensitivity]
mode = "miscal"                       # the ζ sweep (run_lo_sensitivity.jl: miscal | delta | validation_budget)
tuning = "lo_sensitivity_miscal"      # the configs/tuning.toml entry the selectors are tuned on
# The Fig 1 selector roster: the production block-A families + MAGSAC++/RANSAC
# (job-2427 extension) + SIMFIT++ (2026-09-08: MSAC at a loss width re-estimated
# per pair, its initial guess cross-validated on the loss-width axis); welsch_marg
# (WMG) stays out — cut from the paper.
selectors = ["student_t_uniform", "msac", "mlesac", "welsch_cost", "geman", "magsac", "ransac", "sim_fit_pp"]
n_miscal = 0                          # validation pairs of the sweep; 0 = the full validation pool

# ---- the inputs of record (VisualGeometryToolkitEval Reproduce: `missing_inputs` checks each
# path under the data root before a launch, and its content before a run). Each `sha256` is
# VisualGeometryToolkitEval's tree_sha256 of the directory, computed read-only on the author's
# data root on 2026-11-12 (accv2026 6bfe1bc). A pool tree's `_v3/` directory is an
# archived earlier copy kept beside the pool (2026-10-02..06; the pool readers open
# `<scene>.jld2` by name and never read it): not part of the pool of record, so
# `sha256_exclude` leaves it out.
[inputs.pool]
tier = "derived"
path = "accv2026/data/PT-E-SIFT-4K_pf3"
sha256 = "d563419d547f16b2cb83a7ab1883c5567d470433f4409f0c09b0d17eb98dc690"
sha256_exclude = ["_v3/**"]   # the archived copy, not a pool of record
provenance = "the PhotoTourism E scoring pools, regenerated bit for bit by the stage pt_e_pools (scripts/pt_e_pools.jl, configs/pt_e_pools.toml) from pt_raw_validation and pt_raw_test; not published (1.6 TB)"

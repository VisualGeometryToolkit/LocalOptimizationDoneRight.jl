# =============================================================================
# envs/superansac — the SupeRANSAC environment (configs/pt_e_superansac.toml
# [environment]; src/superansac.jl). SupeRANSAC is an OUTSIDE dependency: its
# Python binding pysuperansac is built from source into this environment's
# conda environment (CondaPkg.toml), never into the project's. Only
# scripts/tools/superansac_worker.jl runs here; `scripts/superansac_e2e.jl
# --check` says whether it is importable, and src/superansac.jl
# `require_superansac` prints the installation steps when it is not.
# =============================================================================


# Coordinator ruling (2026-11-13, wave 10): one idiom shape, two concepts. The stack has no TOML-sentinel reader to
# call instead: Core's `lo_field_from_toml` is the hook this function implements, and Estimation's
# `optimization_strategy_from_toml` reads a strategy table, whose "none" is a registry tag, not a field value.
[[similar]]
functions = ["src/strategies/config_toml.jl::_entry_from_toml",
             "CaliBlobs:src/calibration/config.jl::_optimization_strategy_from_toml"]
